name: Build Switch NRO

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compilation du Launcher
        run: |
          # 1. Configuration des outils devkitPro
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export DEVKITA64=$DEVKITPRO/devkitA64
          export PATH=$DEVKITA64/bin:$DEVKITPRO/tools/bin:$PATH
          
          # 2. Vérification de la structure (pour le debug)
          ls -R
          
          # 3. Lancement de la compilation
          # On vérifie si le Makefile existe avant de lancer
          if [ -f "Makefile" ]; then
            make clean || true
            make
          else
            echo "ERREUR : Makefile introuvable à la racine du dépôt !"
            exit 1
          fi

      - name: Sauvegarde du fichier NRO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mekanism-Launcher-NRO
          path: ./*.nro
